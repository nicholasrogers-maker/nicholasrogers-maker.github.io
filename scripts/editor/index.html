<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="editor-token" content="__TOKEN__" />
    <title>Site editor</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div class="shell">
      <aside class="side">
        <div class="brand"><span class="g">editor</span>#<span class="cur"></span></div>
        <nav id="nav" aria-label="Sections"></nav>
        <div class="side-foot">
          <a id="site-link" href="#" target="_blank" rel="noopener" hidden>Open site preview ↗</a>
          <p class="muted small">Local only. Nothing here is public until you press Publish.</p>
        </div>
      </aside>
      <main id="main" tabindex="-1">
        <p class="muted">Loading…</p>
      </main>
    </div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
